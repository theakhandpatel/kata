name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # Prove every chapter rejects its starter and accepts its reference. A
      # chapter whose starter passes grades nothing.
      - name: verify course integrity
        run: go run ./cmd/lathe verify
