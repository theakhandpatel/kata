# Netlify builds the site from source: Go generates the VitePress project, and
# VitePress builds it. Nothing generated is committed.

[build]
  command = "go run ./cmd/kata site"
  publish = "site/dist"

[build.environment]
  GO_VERSION = "1.26"
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
